name: Build both platforms, submit iOS

# No `on:` trigger — this workflow is run manually from mobile/ with:
#   eas workflow:run .eas/workflows/submit.yml
# Add an `on: push:` block later if you ever want it to run automatically.

jobs:
  # Build the Android app bundle. Not submitted anywhere — download the
  # artifact from the EAS build page and upload it to Play Console yourself.
  build_android:
    name: Build Android (app-bundle)
    type: build
    params:
      platform: android
      profile: production

  # Build the iOS app.
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  # Submit the iOS build produced above to App Store Connect.
  # `needs` makes this wait for build_ios and reuse its artifact automatically.
  submit_ios:
    name: Submit iOS to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
